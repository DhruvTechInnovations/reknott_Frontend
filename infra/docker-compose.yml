services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reknott
      POSTGRES_USER: reknott
      POSTGRES_PASSWORD: reknott_dev
    ports:
      - "5432:5432"
    volumes:
      - reknott-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reknott -d reknott"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - reknott-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  reknott-postgres:
  reknott-redis:
